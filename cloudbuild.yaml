steps:
  # 1. Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/photobooth-qr:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/photobooth-qr:latest'
      - '.'
    timeout: '600s'

  # 2. Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/photobooth-qr'

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'photobooth-qr'
      - '--image=gcr.io/$PROJECT_ID/photobooth-qr:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--add-cloudsql-instances=$PROJECT_ID:us-central1:photobooth-db'

images:
  - 'gcr.io/$PROJECT_ID/photobooth-qr'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
